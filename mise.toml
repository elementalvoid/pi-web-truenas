# Toolchain baked into the image at build time (mise system config
# /etc/mise/config.toml). Anything installed at runtime lands in /data/mise and takes
# precedence over these. `latest` resolves at build time; bump CACHE_BUST to refresh.
[tools]
node = "26.11.1"
bun = "1.4.0"
python = "latest"
go = "latest"
gh = "latest"
awscli = "2.36.29"
kubectl = "latest"
helm = "latest"
terraform = "latest"
rust = "latest"
neovim = "0.12.4"
uv = "latest"
fzf = "latest"
yq = "latest"
shellcheck = "latest"
jq = "latest"
